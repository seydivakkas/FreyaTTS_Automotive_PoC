[project]
name = "freya-automotive"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "pydantic-settings>=2,<3", "httpx>=0.28,<1", "numpy>=1.26,<3", "scipy>=1.12,<2", "soxr>=0.5,<2", "soundfile>=0.12,<1", "tzdata>=2025.1", "reportlab>=4.0.0"]

[project.optional-dependencies]
models = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "einops",
    "librosa",
    "huggingface-hub",
    "safetensors",
    "voxcpm",
    "faster-whisper",
    "silero-vad",
    "peft>=0.15",
    "accelerate>=1.0",
]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "jsonschema>=4.20,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib --basetemp=data/test_tmp"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
