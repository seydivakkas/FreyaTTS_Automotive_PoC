name: Local assistant checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra test
      - run: uv run --extra test pytest -q --basetemp=data/pytest
      - run: uv run --extra test alembic upgrade head
      - run: uv run --extra test alembic check
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start test server
        run: |
          python -c "from pathlib import Path; Path('.env').write_text('ADMIN_PASSWORD=ci-only-disposable\n')"
          uv run --extra test uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/freya-server.log 2>&1 &
      - run: npx playwright test tests/ui.spec.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
