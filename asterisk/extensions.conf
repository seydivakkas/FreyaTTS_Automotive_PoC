; Include this context in your own extensions.conf. Never expose AudioSocket to the Internet.
[freya-local]
exten => 700,1,Answer()
 same => n,Set(FREYA_UUID=${UUID()})
 same => n,AudioSocket(${FREYA_UUID},127.0.0.1:9092)
 same => n,Hangup()
; Replace the address with the Windows host reachable from Asterisk.
; AudioSocket type 0x10 is PCM16 little-endian mono at 8000 Hz.
; Do not set the channel to slin16 (that codec name denotes 16 kHz).

; --- Giden (outbound) arama örneği -------------------------------------
; DOĞRULANMAMIŞTIR: Gerçek bir Asterisk ile denenmedi; yalnızca kod okumasına dayanır.
; backend/outbound_dialer.py AMI Originate ile OUTBOUND_UUID değişkenini (OutboundCall.id)
; gönderir. AudioSocket UUID'si bu değer olursa backend çağrı bağlamını (mod, randevu,
; plaka, fiyat) bulur. backend/outbound.py yolu da aynı değeri OUTBOUND_UUID olarak gönderir.
; settings.ami_context / settings.ami_exten değerlerini bu bağlam ve dahili ile eşleyin.
[freya-outbound]
exten => s,1,NoOp(Freya giden arama: ${OUTBOUND_UUID})
 same => n,Answer()
 same => n,GotoIf($["${OUTBOUND_UUID}" = ""]?nouuid)
 same => n,Set(FREYA_UUID=${OUTBOUND_UUID})
 same => n,Goto(run)
 same => n(nouuid),Set(FREYA_UUID=${UUID()})
 same => n(run),AudioSocket(${FREYA_UUID},127.0.0.1:9092)
 same => n,Hangup()
